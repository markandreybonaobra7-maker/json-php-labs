<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 5: PHP + JSON + AJAX</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    input, button { padding: 8px; margin: 6px 0; width: 100%; box-sizing: border-box; }
    button { cursor: pointer; }
    #result { margin-top: 16px; padding: 10px; background: #f2f2f2; border-radius: 4px; display: none; }
    pre { margin: 6px 0 0; }
  </style>
</head>
<body>
  <h2>Welcome Form</h2>
  <form id="myForm">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    <button type="submit">Submit</button>
  </form>

  <div id="result">
    <strong id="message"></strong>
    <pre id="raw"></pre>
  </div>

  <script>
    document.getElementById('myForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value;

      fetch('lab5_process.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      })
        .then(response => response.json())
        .then(data => {
          document.getElementById('message').textContent = data.message;
          document.getElementById('raw').textContent = JSON.stringify(data);
          document.getElementById('result').style.display = 'block';
        })
        .catch(err => {
          document.getElementById('message').textContent = 'Error: ' + err;
          document.getElementById('result').style.display = 'block';
        });
    });
  </script>
</body>
</html>
